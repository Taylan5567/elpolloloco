<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="./img/3_enemies_chicken/chicken_small/1_walk/3_w.png"
      type="image/png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_forward" />
    <link rel="stylesheet" href="./mobile.css" />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./models/game-audio.class.js"></script>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/tinychicken.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level_one.js"></script>
    <script src="./models/statusbar.class.js"></script>
    <script src="./models/statusbar-coin.class.js"></script>
    <script src="./models/statusbar-bottles.class.js"></script>
    <script src="./models/statusbar-endboss.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/start.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/endscreen.class.js"></script>
    <script src="./js/mobile.js"></script>
    <script src="./js/game.js"></script>
  </head>
  <body>
    <h1 id="ueber">El Pollo Loco</h1>
    <div id="canvasContainers" class="canvasContainer">
      <canvas id="canvas" width="720" height="480"> </canvas>
      <img
        src="img/5_background/first_half_background.png"
        id="youwinbackground"
        style="display: none"
        alt="" />
      <img
        src="img/You_won_you_lost/You_won_A.png"
        id="youwin"
        style="display: none"
        alt="" />
      <img
        src="img/You_won_you_lost/You lost.png"
        id="youlost"
        style="display: none"
        alt="" />
      <div class="controller">
        <button class="startButton" id="start" onclick="startEngine()">
          START
        </button>
        <button
          class="gameOverButton"
          id="gameover"
          style="display: none"
          onclick="restartGame()">
          RESTART
        </button>
        <button class="controlMobileleft" id="left">
          <img src="./img/10_icons/arrow_back.svg" />
        </button>
        <button class="controlMobileright" id="right">
          <img src="./img/10_icons/arrow_forward.svg" />
        </button>
        <button class="controlMobilejump" id="jump">Jump</button>
        <button class="controlMobilethrow" id="throw">Throw</button>
      </div>
      <button class="mute" id="mute" onclick="muteGame()">
        <img id="mutebutton" src="img/10_icons/mute.png" alt="" />
      </button>
    </div>

    <div class="overlay" id="overlay">
      <div class="iconContainer">
        <div class="phone">
          <i class="fa fa-repeat"></i>
        </div>
        <p>Rotate your device!</p>
      </div>
    </div>
    <div class="decrtwo" id="descr">
      <h2>How to Play</h2>
      <div class="descr">
        <div class="imprint">
          <form action="./imprint.html">
            <button href="./imprint.html">IMPRINT</button>
          </form>
        </div>
        <div class="howto">
          <div class="controls">
            <div class="run">
              <span>RUN</span>
              <div class="control">
                <button disabled>
                  <img src="./img/10_icons/arrow_back.svg" />
                </button>
                <button disabled>
                  <img src="./img/10_icons/arrow_forward.svg" />
                </button>
              </div>
            </div>
            <div class="jump">
              <span>Jump</span>
              <button disabled>SPACE</button>
            </div>
            <div class="throw">
              <span>Throw</span>
              <button disabled>D</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
